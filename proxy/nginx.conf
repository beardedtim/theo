# Single entrypoint for the prod stack: everything under /api/ goes to the
# FastAPI service (prefix stripped -- its routes are unprefixed, e.g. /search),
# everything else goes to the client's static build. This split exists
# because the client's own routes (/search, /events, /lexicon, ...) collide
# with API paths of the same name -- without the /api prefix they can't share
# one origin. TLS is expected to be terminated upstream of this proxy.
server {
    listen 80;
    server_name _;

    # Hide version number
    server_tokens off;

    client_max_body_size 10m;

    # Basic timeout protections against slow scanners (Slowloris)
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    # Compress API JSON and client assets -- /search responses carry full
    # verse text and shrink ~4x. gzip_proxied is required for gzip to apply
    # to proxied (api/client) responses at all.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml application/manifest+json;

    # Docker's embedded DNS -- re-resolve api/client on each request instead
    # of caching the IP from nginx startup, so a recreated container (restart,
    # redeploy) doesn't leave this proxy pointing at a dead address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Server "Theo/SproutFaith(v1.0)" always;
    }

    # Everything the client actually serves: the wouter routes in
    # client/src/App.tsx's <Switch> (root, search, verses, notes incl.
    # /notes/*, lexicon), the hashed Vite build output under /assets/,
    # everything in client/public/static/ (icons, manifest, ...) served at
    # /static/, and robots.txt/sitemap.xml -- crawlers only ever check
    # those at the literal site root, so they stay top-level exceptions
    # rather than living under /static/ like the rest of client/public/
    # (see scripts/generate_sitemap.py). Scanner noise (/admin, /.env,
    # /+CSCOE+/logon.html, ...) doesn't match any of these and falls
    # through to the 404 below instead of getting client:80's try_files
    # fallback to index.html -- keep this in sync with App.tsx's routes;
    # new files under client/public/static/ need no changes here, but
    # anything added to client/public/ directly does.
    location ~ ^/(?:$|assets/|static/|robots\.txt$|sitemap\.xml$|search(?:/|$)|verses(?:/|$)|notes(?:/|$)|lexicon(?:/|$)) {
        set $upstream_client client:80;
        proxy_pass http://$upstream_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Helpful & Modern Security Headers ---

        # Stop browsers from guessing content types (prevents XSS via malicious uploads)
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent framing/clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Safer referrer policy (passes domain name on cross-origin, hides sensitive paths)
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Explicitly disable dangerous browser APIs unless needed
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

        # Clean up identity headers
        add_header X-Server "Theo/SproutFaith(v1.0)" always;
    }

    # Deny access to any . files
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 444;
    }

    location / {
        # Return 444: A special Nginx-only status code that instantly DROPS 
        # the connection without sending any response headers back. 
        # It wastes scanner sockets and leaves them hanging until timeout.
        return 444;
    }
}
