# Single entrypoint for the prod stack: everything under /api/ goes to the
# FastAPI service (prefix stripped -- its routes are unprefixed, e.g. /search),
# everything else goes to the client's static build. This split exists
# because the client's own routes (/search, /events, /lexicon, ...) collide
# with API paths of the same name -- without the /api prefix they can't share
# one origin. TLS is expected to be terminated upstream of this proxy.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Docker's embedded DNS -- re-resolve api/client on each request instead
    # of caching the IP from nginx startup, so a recreated container (restart,
    # redeploy) doesn't leave this proxy pointing at a dead address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_client client:80;
        proxy_pass http://$upstream_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
